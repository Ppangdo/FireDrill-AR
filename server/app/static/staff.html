<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireDrill 요원 화면</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d2129; --muted:#6b7280; --line:#e2e5ea;
          --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --off:#9ca3af; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1b1f25; --text:#e8eaed; --muted:#9aa1ab; --line:#2c323a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  #net { font-size:13px; color:var(--muted); }
  #grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--off); flex:none; }
  .dot.on { background:var(--ok); } .dot.stale { background:var(--warn); }
  .name { font-weight:600; font-size:16px; }
  .conn { margin-left:auto; font-size:13px; color:var(--muted); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:0 0 10px; font-size:14px; }
  dt { color:var(--muted); } dd { margin:0; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .fed { margin-bottom:12px; }
  .fed .label { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); }
  .bar { height:12px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; width:0; background:var(--ok); transition:width .3s; }
  .bar > i.mid { background:var(--warn); } .bar > i.high { background:var(--bad); }
  button { width:100%; min-height:48px; border:0; border-radius:10px; background:var(--bad); color:#fff;
           font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { background:var(--off); cursor:not-allowed; }
  .msg { font-size:13px; margin-top:6px; min-height:1.2em; color:var(--muted); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>FireDrill 요원 화면</h1>
  <span id="net">연결 중…</span>
</header>
<div id="grid"><p class="empty">기기 목록을 불러오는 중…</p></div>

<script>
const token = new URLSearchParams(location.search).get("token") || "";
const headers = { "X-Device-Token": token };
const grid = document.getElementById("grid");
const net = document.getElementById("net");
const messages = {};
const STATE_STALE_S = 5;

const esc = s => String(s ?? "-").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function card(d) {
  const st = d.status;
  const stale = d.connected && (d.status_age_s == null || d.status_age_s > STATE_STALE_S);
  const fed = st ? Math.max(0, Math.min(1, st.fed)) : 0;
  const level = fed >= 0.6 ? "high" : fed >= 0.3 ? "mid" : "";
  const conn = d.connected ? (stale ? "상태 수신 없음" : "연결됨") : "연결 끊김";
  return `<div class="card">
    <div class="top"><span class="dot ${d.connected ? (stale ? "stale" : "on") : ""}"></span>
      <span class="name">${esc(d.device_id)}</span><span class="conn">${conn}</span></div>
    <dl>
      <dt>상태</dt><dd>${esc(st?.state)}</dd>
      <dt>구역</dt><dd>${esc(st?.zone)}</dd>
      <dt>경과</dt><dd>${st ? st.t.toFixed(0) + "초" : "-"}</dd>
      <dt>신체 단계</dt><dd>${st ? st.stage : "-"}</dd>
      <dt>훈련 id</dt><dd>${esc(st?.run_id ? st.run_id.slice(0, 8) : null)}</dd>
    </dl>
    <div class="fed"><div class="label"><span>FED (누적 노출)</span><span>${st ? fed.toFixed(2) : "-"}</span></div>
      <div class="bar"><i class="${level}" style="width:${(fed * 100).toFixed(0)}%"></i></div></div>
    <button data-device="${esc(d.device_id)}" ${d.connected ? "" : "disabled"}>비상 중단</button>
    <div class="msg">${esc(messages[d.device_id] || "")}</div>
  </div>`;
}

async function refresh() {
  try {
    const r = await fetch("/staff/devices", { headers });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error ? body.error.message : r.status);
    net.textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR");
    grid.innerHTML = body.devices.length ? body.devices.map(card).join("")
                                         : '<p class="empty">등록된 기기가 없습니다.</p>';
  } catch (e) {
    net.textContent = "서버 연결 실패: " + e.message;
  }
}

grid.addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-device]");
  if (!btn) return;
  const device = btn.dataset.device;
  if (!confirm(device + " 훈련을 중단할까요?")) return;
  btn.disabled = true;
  try {
    const r = await fetch("/staff/abort/" + encodeURIComponent(device), { method: "POST", headers });
    const body = await r.json();
    messages[device] = r.ok ? "중단 신호 보냄 " + new Date().toLocaleTimeString("ko-KR")
                            : "실패: " + (body.error ? body.error.message : r.status);
  } catch (e) {
    messages[device] = "실패: " + e.message;
  }
  refresh();
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
