[project]
name = "firedrill-server"
version = "0.1.0"
description = "FireDrill-AR training server (명세서 9장, 14.6)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "anthropic>=0.40",
    "wsproto>=1.3.2",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
